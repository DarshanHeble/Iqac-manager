# -----------------------------------------------------------------------------
# nginx — serve the SPA and proxy the API.
#
# The split matters: the Angular app requests `/api` relative to its own origin
# so the Flask session cookie is sent without CORS or a token. Serving the app
# and the API from one origin is what makes that work.
# -----------------------------------------------------------------------------

user nginx;
worker_processes auto;

# Logs to the container's stdout/stderr so `docker compose logs` shows them and
# no log files accumulate in the image.
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Hashed filenames, so assets are immutable — but index.html must never be
  # cached or a deploy leaves browsers on the old bundle.
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml font/woff2;

  server {
    # Both families, explicitly. The stock nginx image ships an entrypoint script
    # that adds the IPv6 listener, but it only edits conf.d/default.conf — which
    # this config replaces, so the listener has to be written here. Without it,
    # anything resolving localhost to ::1 gets connection refused.
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular injects relative URLs, so a sub-path deployment needs this set to
    # match. Harmless at the root.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Hashed assets: cache hard, safe to cache forever.
    location ~* \.(?:css|js|mjs|woff2?|ttf|svg|png|jpe?g|gif|webp|ico|json|txt)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # The API. Same host, so the session cookie set by Flask is stored and sent
    # without any cross-origin handling at all.
    #
    # `proxy_pass` has no trailing path on purpose: nginx passes the URI through
    # unmodified, so Flask sees exactly what the browser asked for. Writing
    # `proxy_pass http://backend:5000/` here would strip the /api prefix and
    # silently 404 every call.
    location /api {
      proxy_pass http://backend:5000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;

      # Report generation and PDF builds are slow; the default 60s read timeout
      # cuts them off mid-request.
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;

      # Flask sets its session cookie with Path=/, which is correct here. Stated
      # explicitly because this is the one line whose removal silently logs
      # everyone out.
      proxy_cookie_path / /;
    }

    # Everything else is an Angular route. Without this, a refresh on
    # /styleguide or /login returns 404 from nginx instead of index.html.
    location / {
      try_files $uri $uri/ /index.html;
    }

    # index.html: never cached, so a redeploy is picked up on reload.
    location = /index.html {
      add_header Cache-Control "no-cache, must-revalidate";
    }
  }
}