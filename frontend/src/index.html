<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>IQAC Worklog</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="crest_logo.png" />

    <!-- Typography. Inter for interface text, Source Serif for display. Both
         have a system-stack fallback in _typography.scss, so the app renders
         correctly offline; the webfonts simply upgrade it when reachable. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />

    <!-- Material Symbols, used by <mat-icon> across the app. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0"
      rel="stylesheet"
    />

    <script>
      // Apply the stored theme before first paint so a dark-mode user never sees
      // a white flash. Mirrors the inline script in the legacy Jinja templates.
      //
      // `data-theme` is the contract: every --ui-* token is scoped to it, and it
      // is what the legacy templates already write. `data-bs-theme` is also set
      // for compatibility with anything expecting Bootstrap 5.3's native dark
      // mode, but this app does not depend on it.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored === 'dark' || stored === 'light' ? stored : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-bs-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <ui-app-root></ui-app-root>
  </body>
</html>
