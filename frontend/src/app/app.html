<a class="skip-link" href="#main-content">Skip to main content</a>

<nav class="rail" aria-label="Main">
  <div class="rail__header">
    <img class="rail__mark" src="crest_logo.png" alt="" />
    <span class="text-label">IQAC</span>
  </div>

  <div class="rail__nav">
    <p class="overline rail__group">Records</p>
    <a class="rail__link" routerLink="/styleguide" routerLinkActive="rail__link--active">
      <mat-icon aria-hidden="true">dashboard</mat-icon>
      <span>Overview</span>
    </a>
    <a class="rail__link" href="/">
      <mat-icon aria-hidden="true">edit_document</mat-icon>
      <span>Worklog</span>
    </a>
  </div>

  <div class="rail__footer">
    <button
      matIconButton
      class="rail__theme"
      [attr.aria-label]="theme.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
      (click)="theme.toggle()"
    >
      <mat-icon aria-hidden="true">{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
  </div>
</nav>

<div class="content">
  <header class="topbar">
    <h2 class="topbar__title">Internal Quality Assurance Cell</h2>

    <ui-badge tone="primary">2025–26</ui-badge>
  </header>

  <main class="content__main" id="main-content" tabindex="-1">
    <router-outlet />
  </main>
</div>
