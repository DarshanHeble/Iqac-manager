{% extends "base.html" %}

{% block title %}Add User - IQAC Admin{% endblock %}

{% block breadcrumbs %}
<span class="text-dark fw-bold">Add User</span>
{% endblock %}

{% block content %}
<div class="container-fluid py-2">
<div class="card">
        <div class="card-body">
          <h6 class="text-primary mb-3">Enter Employee Details</h6>
          <form method="post">
            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Full Name</label>
                <input type="text" name="full_name" class="form-control" placeholder="e.g., Dr. Rajesh Kumar" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required>
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Employee ID</label>
                <input type="text" name="emp_id" class="form-control" placeholder="e.g., CU1234" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Email ID</label>
                <input type="email" name="email" class="form-control" placeholder="Enter email address" required>
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Gender</label>
                <select name="gender" class="form-select" required>
                  <option value="">Select Gender</option>
                  <option>Male</option>
                  <option>Female</option>
                  <option>Other</option>
                </select>
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Designation</label>
                <input type="text" name="designation" class="form-control" placeholder="e.g., Assistant Professor" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Department</label>
                <input type="text" name="department" class="form-control" placeholder="e.g., Computer Science" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label d-block">Roles <span class="text-danger">*</span></label>
              <div class="border rounded p-3 bg-light">
                <div class="form-check mb-2">
                  <input class="form-check-input role-cb" type="checkbox" name="roles" value="IQAC Office" id="roleEmployee">
                  <label class="form-check-label" for="roleEmployee">IQAC Office</label>
                </div>
                <div class="form-check mb-2">
                  <input class="form-check-input role-cb" type="checkbox" name="roles" value="Intern" id="roleIntern">
                  <label class="form-check-label" for="roleIntern">Intern</label>
                </div>
                <div class="form-check mb-2">
                  <input class="form-check-input role-cb" type="checkbox" name="roles" value="School IQAC Coordinator" id="roleSchool">
                  <label class="form-check-label" for="roleSchool">School IQAC Coordinator</label>
                </div>
                <div class="form-check mb-2">
                  <input class="form-check-input role-cb" type="checkbox" name="roles" value="Campus IQAC Coordinator" id="roleCampus">
                  <label class="form-check-label" for="roleCampus">Campus IQAC Coordinator</label>
                </div>
                <div class="form-check mb-2">
                  <input class="form-check-input role-cb" type="checkbox" name="roles" value="Secretary" id="roleSecretary">
                  <label class="form-check-label" for="roleSecretary">Secretary</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input role-cb" type="checkbox" name="roles" value="Admin" id="roleAdmin">
                  <label class="form-check-label" for="roleAdmin">Admin</label>
                </div>
              </div>
            </div>

            <div class="text-end">
              <button type="submit" class="btn btn-primary px-4">Create & Send Credentials</button>
            </div>
          </form>
        </div>
      </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
      document.querySelector('form').addEventListener('submit', function(e) {
        const checked = document.querySelectorAll('.role-cb:checked');
        if (checked.length === 0) {
          e.preventDefault();
          alert('Please select at least one role.');
        }
      });
    </script>
{% endblock %}
